# Render blueprint: New > Blueprint > pick this repository > Apply.
services:
  - type: web
    name: atlas-ai
    runtime: docker
    plan: free
    healthCheckPath: /stats
    envVars:
      # Optional. Without these the site works; the "next steps" are shown in the Atlas's own wording.
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
